name: Validate Changes

on:
  push:
    branches:
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Run Tests
        run: swift test
      - name: Build App Bundle
        run: ./scripts/build-app.sh
